<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #17212b; }
      .section { font: 700 18px Arial, sans-serif; letter-spacing: 1.2px; fill: #536270; }
      .label { font: 700 21px Arial, sans-serif; fill: #17212b; }
      .body { font: 400 17px Arial, sans-serif; fill: #40505d; }
      .small { font: 400 15px Arial, sans-serif; fill: #5b6a75; }
      .formula { font: 600 17px Arial, sans-serif; fill: #27445a; }
      .card { stroke: #c9d3db; stroke-width: 2; }
      .line { stroke: #657887; stroke-width: 3; fill: none; }
      .dash { stroke: #8a9aa5; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#657887"/>
    </marker>
    <marker id="arrow-dash" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8a9aa5"/>
    </marker>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="70" y="58" class="title">Record-level budgeted Schema adaptation</text>
  <text x="70" y="90" class="small">The selector predicts which candidate fields are worth sending before LLM extraction.</text>

  <!-- Offline supervision band -->
  <rect x="55" y="120" width="1490" height="150" rx="18" fill="#f1f6fa" stroke="#d5e0e7" stroke-width="2"/>
  <text x="85" y="153" class="section">OFFLINE SUPERVISION</text>
  <rect x="85" y="174" width="290" height="66" rx="12" class="card" fill="#ffffff"/>
  <text x="230" y="203" text-anchor="middle" class="label">FullSchema outputs</text>
  <text x="230" y="226" text-anchor="middle" class="small">model-assisted silver labels</text>
  <line x1="390" y1="207" x2="500" y2="207" class="line" marker-end="url(#arrow)"/>
  <rect x="520" y="174" width="310" height="66" rx="12" class="card" fill="#ffffff"/>
  <text x="675" y="203" text-anchor="middle" class="label">Presence and length labels</text>
  <text x="675" y="226" text-anchor="middle" class="small">field-wise supervision</text>
  <line x1="845" y1="207" x2="955" y2="207" class="line" marker-end="url(#arrow)"/>
  <rect x="975" y="174" width="500" height="66" rx="12" class="card" fill="#e8f4ee"/>
  <text x="1225" y="203" text-anchor="middle" class="label">M1 selector</text>
  <text x="1225" y="226" text-anchor="middle" class="small">sparse text features, presence and output-length estimates</text>

  <!-- Main online band -->
  <rect x="55" y="300" width="1490" height="300" rx="18" fill="#fffaf1" stroke="#eadfca" stroke-width="2"/>
  <text x="85" y="335" class="section">ONLINE RECORD-LEVEL ADAPTATION</text>

  <rect x="85" y="370" width="250" height="125" rx="14" class="card" fill="#ffffff"/>
  <text x="210" y="408" text-anchor="middle" class="label">Raw record</text>
  <text x="210" y="436" text-anchor="middle" class="body">stable serialization</text>
  <text x="210" y="467" text-anchor="middle" class="small">observable keys, values and text</text>

  <line x1="355" y1="432" x2="445" y2="432" class="line" marker-end="url(#arrow)"/>

  <rect x="465" y="370" width="300" height="125" rx="14" class="card" fill="#e8f4ee"/>
  <text x="615" y="408" text-anchor="middle" class="label">M1 estimates</text>
  <text x="615" y="438" text-anchor="middle" class="formula">p(r,f),  o&#770;(r,f)</text>
  <text x="615" y="469" text-anchor="middle" class="small">field presence and output length</text>

  <line x1="785" y1="432" x2="875" y2="432" class="line" marker-end="url(#arrow)"/>

  <rect x="895" y="355" width="290" height="155" rx="14" class="card" fill="#fff0d6"/>
  <text x="1040" y="391" text-anchor="middle" class="label">Budgeted selection</text>
  <text x="1040" y="423" text-anchor="middle" class="formula">u = p · w</text>
  <text x="1040" y="449" text-anchor="middle" class="formula">c = d + o&#770;</text>
  <text x="1040" y="479" text-anchor="middle" class="small">mandatory fields + knapsack</text>

  <line x1="1205" y1="432" x2="1295" y2="432" class="line" marker-end="url(#arrow)"/>

  <rect x="1315" y="370" width="190" height="125" rx="14" class="card" fill="#ffffff"/>
  <text x="1410" y="408" text-anchor="middle" class="label">Dynamic Schema</text>
  <text x="1410" y="441" text-anchor="middle" class="formula">S<tspan baseline-shift="sub" font-size="13">r</tspan> &#8838; F</text>
  <text x="1410" y="472" text-anchor="middle" class="small">selected fields</text>

  <!-- Dependency from M1 -->
  <path d="M1225,240 C1225,290 615,285 615,358" class="dash" marker-end="url(#arrow-dash)"/>
  <text x="925" y="288" text-anchor="middle" class="small">trained selector reused at call time</text>

  <!-- Downstream band -->
  <rect x="55" y="630" width="1490" height="135" rx="18" fill="#f6f4fa" stroke="#ddd7e9" stroke-width="2"/>
  <text x="85" y="665" class="section">DOWNSTREAM EXECUTION AND MEASUREMENT</text>
  <rect x="370" y="690" width="310" height="52" rx="12" class="card" fill="#ffffff"/>
  <text x="525" y="722" text-anchor="middle" class="label">LLM extraction and validation</text>
  <line x1="1410" y1="510" x2="680" y2="700" class="line" marker-end="url(#arrow)"/>
  <line x1="680" y1="716" x2="775" y2="716" class="line" marker-end="url(#arrow)"/>
  <rect x="795" y="690" width="650" height="52" rx="12" class="card" fill="#ffffff"/>
  <text x="1120" y="722" text-anchor="middle" class="label">actual tokens  ·  online time  ·  throughput  ·  P99</text>

  <text x="85" y="790" class="small">M1 selects fields only; it does not generate field values. The budget is a selection-stage capacity, not an API-token or monetary limit.</text>
</svg>
